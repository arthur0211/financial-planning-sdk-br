name: Installed package portability matrix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portability-cell:
    name: ${{ matrix.cell }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, platform: linux, python: "3.11", cell: linux-py3.11}
          - {os: ubuntu-latest, platform: linux, python: "3.12", cell: linux-py3.12}
          - {os: ubuntu-latest, platform: linux, python: "3.13", cell: linux-py3.13}
          - {os: ubuntu-latest, platform: linux, python: "3.14", cell: linux-py3.14}
          - {os: windows-latest, platform: windows, python: "3.11", cell: windows-py3.11}
          - {os: windows-latest, platform: windows, python: "3.12", cell: windows-py3.12}
          - {os: windows-latest, platform: windows, python: "3.13", cell: windows-py3.13}
          - {os: windows-latest, platform: windows, python: "3.14", cell: windows-py3.14}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Acquire pinned build tools before isolation
        if: matrix.platform == 'windows'
        run: python -m pip install --disable-pip-version-check build==1.4.0 setuptools==84.0.0
      - name: Execute Linux cell
        if: matrix.platform == 'linux'
        env:
          CELL_EVIDENCE: ${{ runner.temp }}/finplanbr-portability/${{ matrix.cell }}.json
        run: python scripts/run_linux_portability_cell.py --python "${{ matrix.python }}" --output "$CELL_EVIDENCE"
      - name: Execute Windows cell
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          CELL_EVIDENCE: ${{ runner.temp }}/finplanbr-portability/${{ matrix.cell }}.json
        run: >-
          ./scripts/run_windows_portability_cell.ps1
          -PythonMinor '${{ matrix.python }}'
          -PythonExecutable python
          -OutputPath $env:CELL_EVIDENCE
      - name: Upload executed cell evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portability-${{ matrix.cell }}
          path: ${{ runner.temp }}/finplanbr-portability/${{ matrix.cell }}.json
          if-no-files-found: error
          retention-days: 14

  portability-matrix:
    name: Fail-closed eight-cell aggregation
    if: always()
    needs: portability-cell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Initialize empty evidence root
        env:
          CELL_ROOT: ${{ runner.temp }}/finplanbr-portability-cells
        run: mkdir -p "$CELL_ROOT"
      - name: Download executed evidence only
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: portability-*
          path: ${{ runner.temp }}/finplanbr-portability-cells
          merge-multiple: true
      - name: Aggregate exact matrix
        env:
          CELL_ROOT: ${{ runner.temp }}/finplanbr-portability-cells
          MATRIX_EVIDENCE: ${{ runner.temp }}/finplanbr-portability-matrix.json
        run: python scripts/aggregate_portability_matrix.py "$CELL_ROOT" --output "$MATRIX_EVIDENCE"
      - name: Upload fail-closed matrix evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portability-matrix
          path: ${{ runner.temp }}/finplanbr-portability-matrix.json
          if-no-files-found: error
          retention-days: 14
